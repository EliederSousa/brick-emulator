# BrickEmu game config (INI). Only keys the C++ port reads.
# Everything the Python .brick files carry beyond this (buttons/hot_keys,
# peripherals/direct_input, SVG face_path, display tuning, sound ROM,
# disasm_roots) is ignored: input is hardcoded in Frontend_SDL.cpp and the
# SDL skin is loaded as Apollo18in1display.png, not from a face path.

[game]
core = SPL03
clock = 690000
rom = ./Apollo18in1B0302.bin
non_crystal_div = 16

[port_pullup]
PA = 0

[port_pkey]
PA = 1
